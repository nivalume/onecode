[workspace]
resolver = "3"
members = [
    "app/onecode",
    "crates/ui",
    "crates/ai",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Single UI dependency: re-exports GPUI, gpui-base, gpui-component, and default assets.
# Do not add a separate `gpui` dependency to avoid version mismatches.
gpui-kit = "0.11"

# Error handling (thiserror in library crates, anyhow in binary crates)
thiserror = "2.0"
anyhow = "1.0"

# Serialization & structured logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
mod_module_files = "warn"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
# Optimize UI/graphics dependencies in dev builds for smooth rendering.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
